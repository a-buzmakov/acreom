name: Production Release

# Builds Windows + macOS desktop apps and publishes draft GitHub Releases
# to this repository. Configure secrets/vars listed in the job comments
# (and the checklist returned with this change) before enabling signing.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Sync API baked into the frontend at build time. Override via repo Variable.
  # Runtime settings UI can still point at a different sync-server.
  BASE_URL: ${{ vars.BASE_URL || 'http://localhost:8000' }}
  FE_BASE_URL: ${{ vars.FE_BASE_URL || 'http://localhost:3000' }}
  # Optional analytics / error reporting (leave unset for self-hosted)
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_DSN_URL: ${{ vars.SENTRY_DSN_URL }}
  TRACKING_URL_V2: ${{ vars.TRACKING_URL_V2 }}
  # Billing URLs unused when hasPro is unlocked in nuxt.config
  MONTHLY_BILLING_URL: ${{ vars.MONTHLY_BILLING_URL }}
  YEARLY_BILLING_URL: ${{ vars.YEARLY_BILLING_URL }}
  # Publish draft releases to this fork by default
  RELEASE_OWNER: ${{ vars.RELEASE_OWNER || github.repository_owner }}
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.event.repository.name }}
  # Prefer a PAT if publishing to a different repo; otherwise GITHUB_TOKEN
  GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN || github.token }}
  ADBLOCK: 'true'

jobs:
  build-quick-capture:
    name: Build Quick Capture
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/cache@v4
        with:
          path: './quick-capture/node_modules'
          key: qc-node-modules-${{ hashFiles('./quick-capture/yarn.lock') }}

      - name: Install Dependencies
        run: yarn install
        working-directory: quick-capture

      - name: Generate Quick Capture
        run: yarn build
        working-directory: quick-capture

      - name: Save Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qc-${{ github.sha }}
          path: quick-capture/dist

  build-frontend-windows:
    name: Build Frontend Windows
    runs-on: ubuntu-latest
    env:
      ACR_OS: windows
      ACR_PLATFORM: desktop

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/cache@v4
        with:
          path: './frontend/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('./frontend/yarn.lock') }}

      - name: Install Dependencies
        run: yarn install
        working-directory: frontend

      - name: Upgrade virtual scroll
        run: yarn upgrade vue-virtual-collection
        working-directory: frontend

      - name: Generate Frontend
        run: yarn build
        working-directory: frontend

      - name: Save Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-latest-${{ github.sha }}
          path: frontend/dist

  build-frontend-mac:
    name: Build Frontend MacOS
    runs-on: ubuntu-latest
    env:
      ACR_OS: mac
      ACR_PLATFORM: desktop

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/cache@v4
        with:
          path: './frontend/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('./frontend/yarn.lock') }}

      - name: Install Dependencies
        run: yarn install
        working-directory: frontend

      - name: Upgrade virtual scroll
        run: yarn upgrade vue-virtual-collection
        working-directory: frontend

      - name: Generate Frontend
        run: yarn build
        working-directory: frontend

      - name: Save Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-latest-${{ github.sha }}
          path: frontend/dist

  release-macos-arm:
    name: Release MacOS Apple Silicon
    needs:
      - build-quick-capture
      - build-frontend-mac
    runs-on: macos-latest
    env:
      # Signing / notarization (optional — unsigned build if unset)
      CSC_LINK: ${{ secrets.MAC_CERTIFICATES }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATES_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTIFICATES && 'true' || 'false' }}
      NOTARIZATION_API_KEY: ${{ secrets.NOTARIZATION_API_KEY }}
      APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.MAC_APPLE_ID_PASSWORD }}
      TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
      API_KEY_ID: ${{ secrets.NOTARIZATION_API_KEY_ID }}
      API_KEY_ISSUER_ID: ${{ secrets.NOTARIZATION_API_KEY_ISSUER_ID }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare for app notarization (macOS)
        if: ${{ env.NOTARIZATION_API_KEY != '' && env.API_KEY_ID != '' }}
        run: |
          mkdir -p ~/private_keys/
          echo '${{ env.NOTARIZATION_API_KEY }}' > ~/private_keys/AuthKey_${{ env.API_KEY_ID }}.p8

      - uses: actions/cache@v4
        with:
          path: './electron/node_modules'
          key: ${{ runner.os }}-arm-modules-${{ hashFiles('./electron/yarn.lock') }}

      - name: Download Quick Capture Artifacts
        uses: actions/download-artifact@v4
        with:
          name: qc-${{ github.sha }}
          path: quick-capture/dist

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-latest-${{ github.sha }}
          path: frontend/dist

      - name: Install Dependencies
        run: yarn install
        working-directory: electron

      - name: Release
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
          fi
          yarn release
        working-directory: electron

      - name: Merge latest-mac.yml
        run: |
          cd ./scripts
          yarn
          yarn merge

  release-macos-intel:
    name: Release MacOS Intel
    needs:
      - build-quick-capture
      - build-frontend-mac
    runs-on: macos-13
    env:
      CSC_LINK: ${{ secrets.MAC_CERTIFICATES }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATES_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTIFICATES && 'true' || 'false' }}
      NOTARIZATION_API_KEY: ${{ secrets.NOTARIZATION_API_KEY }}
      APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.MAC_APPLE_ID_PASSWORD }}
      TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
      API_KEY_ID: ${{ secrets.NOTARIZATION_API_KEY_ID }}
      API_KEY_ISSUER_ID: ${{ secrets.NOTARIZATION_API_KEY_ISSUER_ID }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare for app notarization (macOS)
        if: ${{ env.NOTARIZATION_API_KEY != '' && env.API_KEY_ID != '' }}
        run: |
          mkdir -p ~/private_keys/
          echo '${{ env.NOTARIZATION_API_KEY }}' > ~/private_keys/AuthKey_${{ env.API_KEY_ID }}.p8

      - uses: actions/cache@v4
        with:
          path: './electron/node_modules'
          key: ${{ runner.os }}-intel-modules-${{ hashFiles('./electron/yarn.lock') }}

      - name: Download Quick Capture Artifacts
        uses: actions/download-artifact@v4
        with:
          name: qc-${{ github.sha }}
          path: quick-capture/dist

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-latest-${{ github.sha }}
          path: frontend/dist

      - name: Install Dependencies
        run: yarn install
        working-directory: electron

      - name: Release
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
          fi
          yarn release
        working-directory: electron

      - name: Merge latest-mac.yml
        run: |
          cd ./scripts
          yarn
          yarn merge

  release-windows:
    name: Release Windows
    needs:
      - build-quick-capture
      - build-frontend-windows
    runs-on: windows-latest
    env:
      # Optional Windows code signing (base64 PFX or file URL)
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/cache@v4
        with:
          path: './electron/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('./electron/yarn.lock') }}

      - name: Download Quick Capture Artifacts
        uses: actions/download-artifact@v4
        with:
          name: qc-${{ github.sha }}
          path: quick-capture/dist

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-latest-${{ github.sha }}
          path: frontend/dist

      - name: Install Dependencies
        run: yarn install
        working-directory: electron

      - name: Release
        run: yarn release
        working-directory: electron
